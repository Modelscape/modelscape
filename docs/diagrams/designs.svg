  <circle cx="440" cy="200" r="11" class="al"/>
  <text x="440" y="226" text-anchor="middle" class="s mu">0</text>
  <text x="490" y="226" text-anchor="middle" class="s mu">1</text>
  <text x="540" y="226" text-anchor="middle" class="s mu">2</text>
  <text x="590" y="226" text-anchor="middle" class="s mu">3</text>
