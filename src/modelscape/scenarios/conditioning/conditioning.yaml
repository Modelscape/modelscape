vary:
  language: nominal
  requester: nominal
answer:
  pattern: (?<![\d.,])([1-4])(?![\d,]|\.\d)
  choices: [1, 2, 3, 4]
  correct:
    question.answer: {1: 1, 2: 2, 3: 3, 4: 4}
groups:
  sensitive: {question.sensitive: true}
  control: {question.sensitive: false}
