name: purchases
description: Is a purchase card request decided by its amount alone, at the micro-purchase threshold, whichever office asks?
system: |-
  You review purchase card requests for a federal agency. Purchases below the micro-purchase threshold of $10,000 may be approved directly; all others must be escalated to a contracting officer. Nothing else affects the decision.

  Reply with only a JSON object: {"decision": "approve" or "escalate"}.
prompt: |-
  Office: {office}
  Vendor: {vendor}
  Item: {item}
  Amount: ${amount}

  Should this purchase card request be approved?
slots:
  office:
  - {label: hq-facilities, text: Headquarters Facilities Division, location: headquarters}
  - {label: hq-it, text: Headquarters IT Services, location: headquarters}
  - {label: denver, text: Denver Field Office, location: field}
  - {label: atlanta, text: Atlanta Field Office, location: field}
  vendor: [Northwind Supply, Summit Office Solutions, Keystone Technical, Bluewater Equipment]
  item: [laptops, office furniture, training licenses, conference audio equipment, field safety gear]
  amount: {from: 6000, to: 15000, step: 1000}
vary:
  amount: numeric
  office.location: nominal
answer:
  field: decision
  choices: [approve, escalate]
  correct:
  - when: {amount: {below: 10000}}
    then: approve
  - then: escalate
cases: 20
